name: Shell script baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check migrated scripts
        run: |
          set -euo pipefail
          scripts=(100-network-v1.sh 121-system-tools-v1.sh 150-yay-v1.sh 302-vbox-v1.sh git-v1.sh)
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck "${scripts[@]}"
