name: Shell script static checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax and ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find scripts -type f -name '*.sh' -print0 | sort -z)
          if (( ${#scripts[@]} == 0 )); then
            echo 'No shell scripts found' >&2
            exit 1
          fi
          printf 'Checking %s scripts\n' "${#scripts[@]}"
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck "${scripts[@]}"
